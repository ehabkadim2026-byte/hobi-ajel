# المسار السريع «أول من يرصد»: جلسة طويلة (~5.5 ساعة) تفحص القنوات الرسمية كل 30 ثانية وتنشر المهم فوراً.
# تُعاد كل 6 ساعات بالجدولة، وتطلقها الجولة الرئيسية إذا لم تكن تعمل.
name: fastlane
on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 */6 * * *"
permissions: {contents: write}
concurrency: {group: fastlane, cancel-in-progress: false}
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -q libraqm0 >/dev/null 2>&1 || true; pip install -q pillow arabic-reshaper python-bidi
      - uses: actions/cache/restore@v4
        with: {path: data/fastlane_state.json, key: "fastlane-${{ github.run_id }}", restore-keys: "fastlane-"}
      - run: python3 -m tools.fastlane
        timeout-minutes: 340
        env:
          GH_TOKEN: ${{ github.token }}
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
          MARSAD_TG_CHAT_ID: ${{ secrets.MARSAD_TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: data/fastlane_state.json, key: "fastlane-${{ github.run_id }}"}
      - name: relaunch
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/fastlane.yml/dispatches" -f ref=main || true
