# المسار السريع «أول من يرصد»: جلسة طويلة (~5.5 ساعة) تفحص القنوات الرسمية كل 30 ثانية وتنشر المهم فوراً.
# تُعاد كل 6 ساعات بالجدولة، وتطلقها الجولة الرئيسية إذا لم تكن تعمل.
name: fastlane
on:
  workflow_dispatch:
    inputs:
      runner: {description: "فارغ = سيرفر مرام (جلسة 23 ساعة)، gh = مشغّلات GitHub (احتياط)", required: false, default: ""}
  schedule:
    - cron: "7 */6 * * *"
permissions: {contents: write}
concurrency: {group: fastlane, cancel-in-progress: false}
jobs:
  fast:
    runs-on: ${{ inputs.runner == 'gh' && 'ubuntu-latest' || fromJSON('["self-hosted","aka"]') }}
    timeout-minutes: ${{ inputs.runner == 'gh' && 350 || 1440 }}
    steps:
      - name: gh on self-hosted (لا يفعل شيئاً على مشغّلات GitHub)
        run: |
          command -v gh >/dev/null && exit 0
          V=2.63.2; D="$HOME/.local/gh-$V"
          [ -x "$D/bin/gh" ] || { mkdir -p "$D" && curl -fsSL "https://github.com/cli/cli/releases/download/v$V/gh_${V}_linux_amd64.tar.gz" | tar xz -C "$D" --strip-components=1; }
          echo "$D/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -q libraqm0 >/dev/null 2>&1 || true; pip install -q pillow arabic-reshaper python-bidi imageio-ffmpeg telethon cryptography
      - uses: actions/cache/restore@v4
        with: {path: data/fastlane_state.json, key: "fastlane-${{ github.run_id }}", restore-keys: "fastlane-"}
      - run: python3 -m tools.fastlane
        timeout-minutes: ${{ inputs.runner == 'gh' && 340 || 1420 }}
        env:
          FAST_MINUTES: ${{ inputs.runner == 'gh' && '330' || '1380' }}
          GH_TOKEN: ${{ github.token }}
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
          MARSAD_TG_CHAT_ID: ${{ secrets.MARSAD_TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: data/fastlane_state.json, key: "fastlane-${{ github.run_id }}"}
      - name: relaunch
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/fastlane.yml/dispatches" -f ref=main -f "inputs[runner]=${{ inputs.runner }}" || true
