name: probe-name
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for u in alraqim alsatralawal raqeem raqeem_iq raqim_iq; do
            h=$(curl -sL "https://t.me/$u")
            t=$(echo "$h" | grep -o 'property="og:title" content="[^"]*'; echo "$h" | grep -o 'property="og:description" content="[^"]*' | head -c 200)
            x=$(echo "$h" | grep -o '<div class="tgme_page_extra">[^<]*' | sed 's/.*>//')
            echo "$u | ${t:-NONE} | ${x}" >> names.txt
          done
          cat names.txt
          gh release upload probe names.txt --clobber -R ${{ github.repository }}
