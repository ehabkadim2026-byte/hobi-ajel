name: probe-name
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for u in raqeem raqim raqeem_iq raqim_iq alraqeem alraqim raqeemiq raqeem_news alsatr_alawal satr_awal alsatralawal mirsad mirsad_iq almirsad mirsadiq tawqeet_baghdad tawqit_baghdad btawqeet_baghdad; do
            h=$(curl -sL "https://t.me/$u")
            t=$(echo "$h" | grep -o '<div class="tgme_page_title"[^>]*><span[^>]*>[^<]*' | sed 's/.*>//')
            x=$(echo "$h" | grep -o '<div class="tgme_page_extra">[^<]*' | sed 's/.*>//')
            echo "$u | ${t:-NONE} | ${x}" >> names.txt
          done
          cat names.txt
          gh release upload probe names.txt --clobber -R ${{ github.repository }}
