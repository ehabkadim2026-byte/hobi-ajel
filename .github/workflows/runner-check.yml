name: runner-check
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
jobs:
  check:
    runs-on: [self-hosted, aka]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/selfhost-prep
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q ctranslate2 sentencepiece pillow arabic-reshaper python-bidi imageio-ffmpeg
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          echo "host: $(hostname)"; nproc; free -h | head -2; df -h / | tail -1
          python -V; ffmpeg -version | head -1; gh --version | head -1
          gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
          python -c "from PIL import features; print('raqm', features.check('raqm'))"
          python -m tools.selftest 2>&1 | tail -5 || true
