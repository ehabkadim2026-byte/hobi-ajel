name: reel
# «نشرة دقيقة»: فيديو عمودي يومي لأهم 5 أخبار، يُرسل للمحررين بالخاص (9:17 مساءً بغداد)
on:
  schedule: [{cron: "17 18 * * *"}]
  workflow_dispatch:
    inputs:
      to_channel: {description: "نشر بالقناة (1) أو للمحررين فقط (0)", default: "0"}
permissions: {contents: write}
concurrency: {group: reel, cancel-in-progress: true}
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -q libraqm0 >/dev/null 2>&1 || true; pip install -q pillow numpy imageio-ffmpeg arabic-reshaper python-bidi
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/marsad.db
            data/translations.json
            data/tg_sent.json
            data/tg_chat.json
          key: "marsad-db-reel-${{ github.run_id }}"
          restore-keys: "marsad-db-"
      - run: curl -sSL -m 30 "https://ehabkadim2026-byte.github.io/hobi-ajel/news.json" -o pwa/news.json
      - run: python3 -c "from PIL import features; print('raqm', features.check('raqm'))"
      - run: python3 -m tools.reel
        env: {MARSAD_TG_BOT_TOKEN: "${{ secrets.MARSAD_TG_BOT_TOKEN }}", GH_TOKEN: "${{ github.token }}", REEL_TO_CHANNEL: "${{ inputs.to_channel }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
      - name: archive
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          ls data/reel_*.mp4 >/dev/null 2>&1 || exit 0
          gh release view reel >/dev/null 2>&1 || gh release create reel --title "نشرة دقيقة" --notes "فيديو يومي عمودي لأهم الأخبار" --prerelease
          gh release upload reel data/reel_*.mp4 data/reel_*_sheet.jpg --clobber
