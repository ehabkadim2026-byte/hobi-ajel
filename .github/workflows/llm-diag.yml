name: llm-diag
on: {workflow_dispatch: {}}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m tools.llm_diag
        env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
      - run: pip install -q pillow && python3 -m tools.wm_diag
        env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
