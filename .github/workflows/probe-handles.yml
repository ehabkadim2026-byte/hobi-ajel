name: probe-handles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for h in rasid_iq rasidiq rasid_iraq alrasid_iq isharaiq ishara_iq marsadiraq khabar_awal awwalan_iq nabd_iq satr_iq iraq_rasid rasidnews; do
            p=$(curl -sSL -m 15 "https://t.me/$h")
            if echo "$p" | grep -q 'tgme_page_extra'; then echo "$h TAKEN $(echo "$p" | grep -o '<div class="tgme_page_title"[^<]*<span[^>]*>[^<]*' | sed 's/.*>//' | head -1) | $(echo "$p" | grep -o '[0-9 ]*\(subscribers\|members\|monthly users\)' | head -1)"; 
            elif echo "$p" | grep -q 'tgme_page_title'; then echo "$h TAKEN(user)"; else echo "$h FREE?"; fi
          done | tee handles.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload probe handles.txt --clobber -R ${{ github.repository }}
