# فحص مؤقت لهوية القناة بعد تغيير اسمها — يُحذف بعد قراءة النتيجة
name: probe-brand
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-brand.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://t.me/s/akamedia_iq https://t.me/akamedia_iq https://t.me/s/hassawassal; do
            echo "== $u"
            curl -sSL -A "Mozilla/5.0" "$u" -o p.html -w "HTTP %{http_code} final=%{url_effective}\n" || true
            grep -o '<meta property="og:title" content="[^"]*"' p.html | head -1 || true
            grep -o '<div class="tgme_channel_info_header_title"><span dir="auto">[^<]*' p.html | head -1 || true
            grep -o '<title>[^<]*' p.html | head -1 || true
          done
