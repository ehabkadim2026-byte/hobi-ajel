name: brand-tg
on: workflow_dispatch
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TOK: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
      CHAT: ${{ secrets.MARSAD_TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > brand_out.txt 2>&1
          import os, json, urllib.request, urllib.parse, subprocess
          T=os.environ["TOK"].strip(); base=f"https://api.telegram.org/bot{T}/"
          def api(m, files=None, **p):
              if files:
                  import uuid; b="----"+uuid.uuid4().hex; body=b""
                  for k,v in p.items(): body+=f"--{b}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode()
                  for k,(fn,data) in files.items(): body+=f"--{b}\r\nContent-Disposition: form-data; name=\"{k}\"; filename=\"{fn}\"\r\nContent-Type: image/jpeg\r\n\r\n".encode()+data+b"\r\n"
                  body+=f"--{b}--\r\n".encode()
                  req=urllib.request.Request(base+m,data=body,headers={"Content-Type":"multipart/form-data; boundary="+b})
              else:
                  req=urllib.request.Request(base+m,data=urllib.parse.urlencode(p).encode())
              try: return json.loads(urllib.request.urlopen(req,timeout=30).read())
              except urllib.error.HTTPError as e: return json.loads(e.read() or b"{}")
          chat=os.environ.get("CHAT","").strip() or "@hassawassal"
          g=api("getChat",chat_id=chat); r=g.get("result",{})
          print("chat_id",r.get("id"),"title",r.get("title"),"username",r.get("username"))
          me=api("getMe")["result"]
          mem=api("getChatMember",chat_id=r["id"],user_id=me["id"]).get("result",{})
          print("bot can_change_info",mem.get("can_change_info"),"status",mem.get("status"))
          print("setChatTitle",api("setChatTitle",chat_id=r["id"],title="أكا ميديا | AKA MEDIA"))
          desc="أكا ميديا | AKA MEDIA\nعاجل العراق لحظة بلحظة • رصد وتحقق • بلا تكرار ولا إشاعات\nنرى أبعد... ونروي أعمق\n🔔 أخبار محافظتك بالخاص: @My_instegram_chanal_bot"
          print("setChatDescription",api("setChatDescription",chat_id=r["id"],description=desc))
          print("setChatPhoto",api("setChatPhoto",files={"photo":("aka.jpg",open("assets/brand/aka_avatar.jpg","rb").read())},chat_id=r["id"]))
          print("setMyName",api("setMyName",name="أكا ميديا | AKA MEDIA"))
          print("setMyShortDescription",api("setMyShortDescription",short_description="بوت أكا ميديا: عاجل العراق وأخبار محافظتك بالخاص"))
          for u in ["akamedia","aka_media","akamediaiq","akamedia_iq","aka_media_iq","akamediairaq","aka_iq","akamedianews"]:
              h=subprocess.run(["curl","-sL","https://t.me/"+u],capture_output=True,text=True).stdout
              import re
              t=re.search(r'<div class="tgme_page_title"[^>]*>\s*<span[^>]*>([^<]*)',h); x=re.search(r'<div class="tgme_page_extra">([^<]*)',h)
              print("user",u,"|",(t.group(1) if t else "FREE?"),"|",(x.group(1).strip() if x else ""))
          PY
          sed -i "s/$TOK/***/g" brand_out.txt; cat brand_out.txt
          gh release upload probe brand_out.txt --clobber -R ${{ github.repository }}
