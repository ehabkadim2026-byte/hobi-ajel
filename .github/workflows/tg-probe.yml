name: tg-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: probe channel
        run: |
          python3 - <<'PY'
          import re, html, urllib.request, sys
          sys.path.insert(0, '.')
          from tools.tg_video import fetch_post
          from tools.discover import EXCLUDE
          UA={"User-Agent":"Mozilla/5.0"}
          ch="ejolh"
          page=urllib.request.urlopen(urllib.request.Request(f"https://t.me/s/{ch}",headers=UA),timeout=20).read().decode("utf-8","replace")
          title=re.search(r'<meta property="og:title" content="([^"]*)"',page)
          desc=re.search(r'<meta property="og:description" content="([^"]*)"',page)
          ids=re.findall(rf'data-post="{ch}/(\d+)"',page)
          print(f"::notice title=channel::{html.unescape(title.group(1)) if title else '?'} | {html.unescape(desc.group(1))[:200] if desc else ''} | posts={len(ids)} last={ids[-1:]} excluded={bool(EXCLUDE.search(ch+' '+(title.group(1) if title else '')))}")
          ok=0
          for i in ids[-12:][::-1]:
              p=fetch_post(ch,i)
              size=None
              if p["video"]:
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(p["video"],method="HEAD",headers=UA),timeout=15); size=int(r.headers.get("Content-Length",0))//1024//1024
                  except Exception as e: size=type(e).__name__
              print(f"::notice title=post {i}::video={'yes' if p['video'] else 'no'} size_mb={size} too_big={p['too_big']} restricted={p['restricted']} text={p['text'][:90]}")
          PY
