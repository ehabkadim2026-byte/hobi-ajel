name: tg-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: channel dump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import re, html, urllib.request, json
          UA={"User-Agent":"Mozilla/5.0"}
          out=[]; before=""
          for _ in range(3):
              page=urllib.request.urlopen(urllib.request.Request("https://t.me/s/hassawassal"+before,headers=UA),timeout=20).read().decode("utf-8","replace")
              for b in page.split('class="tgme_widget_message_wrap')[1:]:
                  pid=re.search(r'data-post="hassawassal/(\d+)"',b)
                  t=re.search(r'tgme_widget_message_text[^>]*>(.*?)</div>',b,re.S)
                  tm=re.search(r'<time[^>]+datetime="([^"]+)"',b)
                  img=re.search(r"link_preview_image[^>]+background-image:url\('([^']+)'\)",b) or re.search(r"tgme_widget_message_photo_wrap[^>]+background-image:url\('([^']+)'\)",b)
                  vid=bool(re.search(r'<video',b))
                  if pid: out.append({"id":int(pid.group(1)),"t":tm.group(1) if tm else "","text":html.unescape(re.sub(r"<br\s*/?>","\n",re.sub(r"<(?!br)[^>]+>","",t.group(1)))).strip() if t else "","img":img.group(1) if img else None,"video":vid})
              ids=[o["id"] for o in out]
              before=f"?before={min(ids)}" if ids else ""
          out=sorted({o["id"]:o for o in out}.values(),key=lambda o:o["id"])
          json.dump(out,open("chan.json","w"),ensure_ascii=False)
          imgs=[o for o in out if o["img"]][-4:]
          for i,o in enumerate(imgs):
              try: open(f"card{i}.jpg","wb").write(urllib.request.urlopen(urllib.request.Request(o["img"],headers=UA),timeout=20).read())
              except Exception as e: print(e)
          PY
          gh release view probe >/dev/null 2>&1 || gh release create probe --title probe --notes temp --prerelease
          gh release upload probe chan.json card*.jpg --clobber
