# نسخة الهاتف المستقلة من «هوبي عاجل»: جمع كل 10 دقائق + نشر التطبيق على GitHub Pages.
# يعمل فقط بعد رفع المستودع وتفعيل Pages (Settings → Pages → Source: GitHub Actions). لا أسرار مطلوبة.
# مواعيد GitHub المجدولة غير مضمونة (قد تتأخر ساعات في المستودعات الجديدة)، لذلك كل جولة
# تطلق الجولة التالية بنفسها بعد ~90 ثانية من بدايتها. الموعد المجدول احتياط يعيد تشغيل السلسلة إن انقطعت.
name: hobi-ajel
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write, actions: write}
concurrency: {group: hobi-ajel, cancel-in-progress: false}
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: {name: github-pages}
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/marsad.db
            data/translations.json
            data/tg_sent.json
            data/tg_chat.json
          key: "marsad-db-${{ github.run_id }}"
          restore-keys: "marsad-db-"
      - name: translation model cache (Argos en→ar، مجاني)
        uses: actions/cache@v4
        with: {path: ~/argos, key: argos-en-ar-v1}
      - run: pip install -q ctranslate2 sentencepiece pillow arabic-reshaper python-bidi
        continue-on-error: true
      - name: arabic font cache (بطاقات منشورات تلغرام)
        uses: actions/cache@v4
        with: {path: ~/fonts, key: font-noto-kufi-v1}
      - run: |
          mkdir -p ~/fonts
          [ -s ~/fonts/NotoKufiArabic.ttf ] || curl -sSL --max-time 60 -o ~/fonts/NotoKufiArabic.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf" || true
        continue-on-error: true
      - run: python3 -m marsad.cli sources
      - run: python3 -m marsad.cli collect --limit 450
      - name: process (بدون PDF واللوحة لتسريع الجولة)
        run: python3 -c "from marsad import core; c=core.connect(); core.prune(c, 8); core.cluster_items(c, window_hours=48); core.generate_alerts(c)"
      - name: translate foreign titles (ترجمة آلية؛ فشلها لا يوقف الجولة)
        run: python3 -m tools.translate
        continue-on-error: true
        timeout-minutes: 6
      - run: python3 -m tools.export_pwa
      - name: telegram push (قناة الفريق؛ يعمل فقط بعد إضافة السر)
        run: |
          python3 -m tools.tg_push
          echo "::notice title=tg_status::$(cat pwa/tg_status.json)"
        continue-on-error: true
        timeout-minutes: 3
        env:
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
          MARSAD_TG_CHAT_ID: ${{ secrets.MARSAD_TG_CHAT_ID }}
      - uses: actions/cache/save@v4
        with:
          path: |
            data/marsad.db
            data/translations.json
            data/tg_sent.json
            data/tg_chat.json
          key: "marsad-db-${{ github.run_id }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: pwa}
      - uses: actions/deploy-pages@v4
      - name: next round (سلسلة — الجولة التالية بعد ~90 ثانية من بداية هذه)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          wait=$(( 85 - ($(date +%s) - START) )); if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/runs?per_page=10" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length')
          if [ "$n" = "0" ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/dispatches" -f ref=main && echo "dispatched"; else echo "next round already queued ($n)"; fi
