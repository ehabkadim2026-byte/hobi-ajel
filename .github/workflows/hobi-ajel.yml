# نسخة الهاتف المستقلة من «هوبي عاجل»: جمع كل 10 دقائق + نشر التطبيق على GitHub Pages.
# يعمل فقط بعد رفع المستودع وتفعيل Pages (Settings → Pages → Source: GitHub Actions). لا أسرار مطلوبة.
# مواعيد GitHub المجدولة غير مضمونة (قد تتأخر ساعات في المستودعات الجديدة)، لذلك كل جولة
# تطلق الجولة التالية بنفسها بعد ~90 ثانية من بدايتها. الموعد المجدول احتياط يعيد تشغيل السلسلة إن انقطعت.
name: hobi-ajel
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch: {}
  push: {branches: [main]}  # أي تحديث للكود يعيد تشغيل السلسلة إن انقطعت
permissions: {contents: write, pages: write, id-token: write, actions: write}
concurrency: {group: hobi-ajel, cancel-in-progress: false}
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: {name: github-pages}
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - name: successor first (الجولة التالية تُحجز من البداية، فتستمر السلسلة حتى لو تعطلت هذه الجولة أو طالت)
        if: github.event_name != 'schedule' || true
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/runs?per_page=10" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length' || echo 0)
          if [ "$n" = "0" ]; then for a in 1 2 3; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/dispatches" -f ref=main && { echo "::notice title=chain::successor reserved"; break; }; sleep 3; done; else echo "::notice title=chain::successor already pending ($n)"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/marsad.db
            data/translations.json
            data/tg_sent.json
            data/tg_chat.json
          key: "marsad-db-${{ github.run_id }}"
          restore-keys: "marsad-db-"
        # تحذير: لا تغيّر قائمة path أعلاه أبداً — تغييرها يغيّر نسخة الكاش فتضيع القاعدة (حدث مرتين)
      - uses: actions/cache/restore@v4
        with: {path: data/archive_state.json, key: "archive-state-${{ github.run_id }}", restore-keys: "archive-state-"}
      - uses: actions/cache/restore@v4
        with: {path: pwa/reports, key: "reports-${{ github.run_id }}", restore-keys: "reports-"}
      - uses: actions/cache/restore@v4
        with: {path: pwa/cards, key: "cards-${{ github.run_id }}", restore-keys: "cards-"}
      - uses: actions/cache/restore@v4
        with: {path: "data/ops_state.json\ndata/discovery_state.json", key: "ops-state-${{ github.run_id }}", restore-keys: "ops-state-"}
      - name: restore db from independent backup if cache missed
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 -m tools.archive restore
      - name: translation model cache (Argos en→ar، مجاني)
        uses: actions/cache@v4
        with: {path: ~/argos, key: argos-en-ar-fa-tr-v2}
      - run: pip install -q ctranslate2 sentencepiece pillow arabic-reshaper python-bidi
        continue-on-error: true
      - name: arabic font cache (بطاقات منشورات تلغرام)
        uses: actions/cache@v4
        with: {path: ~/fonts, key: font-noto-kufi-v1}
      - run: |
          mkdir -p ~/fonts
          [ -s ~/fonts/NotoKufiArabic.ttf ] || curl -sSL --max-time 60 -o ~/fonts/NotoKufiArabic.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf" || true
        continue-on-error: true
      - run: python3 -m marsad.cli sources
      - name: discovered sources (محرك الاكتشاف + مراجعة المحرر)
        run: if [ -f config/discovered.json ]; then python3 -m marsad.cli sources config/discovered.json; fi
      - run: python3 -m marsad.cli collect --limit 450
      - name: telegram editors inbox (إدخال يدوي + أحكام التحقق)
        run: python3 -m tools.tg_inbox
        continue-on-error: true
        timeout-minutes: 2
        env:
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
          MARSAD_TG_CHAT_ID: ${{ secrets.MARSAD_TG_CHAT_ID }}
      - name: facebook notifications inbox (MacroDroid → ntfy، مجاني)
        run: python3 -m tools.fb_inbox
        continue-on-error: true
        timeout-minutes: 1
        env:
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
      - name: process (بدون PDF واللوحة لتسريع الجولة)
        run: python3 -c "from marsad import core; c=core.connect(); core.prune(c, 5); core.cluster_items(c, window_hours=48); core.generate_alerts(c)"
      - name: translation models (en→ar + fa→en + tr→en، مرة واحدة ثم من الكاش)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -c "from tools.translate import ensure_model, PIVOT; ensure_model(); ensure_model('fa','en',PIVOT['fa']); ensure_model('tr','en',PIVOT['tr'])"; ls ~/argos; du -sh ~/argos
      - name: translate foreign titles (ترجمة آلية؛ فشلها لا يوقف الجولة)
        run: python3 -m tools.translate
        continue-on-error: true
        timeout-minutes: 6
      - name: tv pilot results (من سير العمل المنفصل)
        continue-on-error: true
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download tv-pilot -p tv.json -D pwa --clobber || echo "no tv yet"
      - run: python3 -m tools.export_pwa
      - name: archive (لقطة كل 30 دقيقة + أرشيف يومي + اختبار استعادة + أرقام السعة)
        continue-on-error: true
        timeout-minutes: 4
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python3 -m tools.archive snapshot
          python3 -m tools.archive daily
          python3 -m tools.archive stats
      - name: metrics (لوحة الأداء + العينة المرجعية اليومية)
        continue-on-error: true
        timeout-minutes: 2
        run: python3 -m tools.metrics
      - name: source discovery (كل 6 ساعات، وقرارات المحرر كل جولة)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 -m tools.discover
      - name: ops center (تدفق الأخبار + العزل + فحص 6 ساعات)
        continue-on-error: true
        timeout-minutes: 2
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 -m tools.ops
      - name: morning report (7 صباحاً بغداد)
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: "${{ github.token }}"
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
        run: python3 -m tools.report_daily
      - name: new sources check
        continue-on-error: true
        run: |
          python3 -c "
          import json
          new={x['id'] for x in json.load(open('config/sources.json'))['sources'] if x.get('added_by')=='توسعة 30/10'}
          h=[x for x in json.load(open('pwa/health.json')) if x['id'] in new]
          print('::notice title=new_sources::'+json.dumps({x['name'][:30]:[x.get('state'),x.get('items_24h'),(x.get('error') or '')[:30]] for x in h},ensure_ascii=False))
          "
      - name: telegram push (قناة الفريق؛ يعمل فقط بعد إضافة السر)
        run: |
          python3 -m tools.tg_push
          echo "::notice title=tg_status::$(cat pwa/tg_status.json)"
        continue-on-error: true
        timeout-minutes: 3
        env:
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
          MARSAD_TG_CHAT_ID: ${{ secrets.MARSAD_TG_CHAT_ID }}
      - uses: actions/cache/save@v4
        with:
          path: |
            data/marsad.db
            data/translations.json
            data/tg_sent.json
            data/tg_chat.json
          key: "marsad-db-${{ github.run_id }}"
      - uses: actions/cache/save@v4
        if: always()
        with: {path: data/archive_state.json, key: "archive-state-${{ github.run_id }}"}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: pwa/reports, key: "reports-${{ github.run_id }}"}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: pwa/cards, key: "cards-${{ github.run_id }}"}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: "data/ops_state.json\ndata/discovery_state.json", key: "ops-state-${{ github.run_id }}"}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: pwa}
      - uses: actions/deploy-pages@v4
      - name: "telegram send (بعد نشر الموقع — نص قابل للنسخ + بطاقة كبيرة فوقه)"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m tools.tg_push --send
        env:
          MARSAD_TG_BOT_TOKEN: ${{ secrets.MARSAD_TG_BOT_TOKEN }}
          MARSAD_TG_CHAT_ID: ${{ secrets.MARSAD_TG_CHAT_ID }}
      - name: next round (سلسلة — الجولة التالية بعد ~90 ثانية من بداية هذه)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          wait=$(( 85 - ($(date +%s) - START) )); if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/runs?per_page=10" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length')
          if python3 -c "import json,sys,datetime as d; t=json.load(open('config/chain_test.json')); sys.exit(0 if d.datetime.now(d.timezone.utc)<d.datetime.fromisoformat(t['pause_until'].replace('Z','+00:00')) else 1)" 2>/dev/null; then
            echo "::notice title=chain::اختبار قبول: توقف متعمد — لن تُطلق الجولة التالية"; n=skip
          fi
          if [ "$n" = "0" ]; then
            ok=0; for a in 1 2 3; do if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/dispatches" -f ref=main; then ok=1; break; fi; sleep 5; done
            if [ "$ok" = "1" ]; then echo "::notice title=chain::dispatched"; else echo "::warning title=chain::فشل إطلاق الجولة التالية"; fi
          else echo "::notice title=chain::next round already queued ($n)"; fi
          # المراقب المستقل: إذا غاب نطلقه (سلسلتان تحيي إحداهما الأخرى)
          w=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status!="completed")]|length' || echo 1)
          if [ "$w" = "0" ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog.yml/dispatches" -f ref=main && echo "::notice title=chain::watchdog dispatched" || true; fi
          # تجربة التلفزيون: تُطلق كل ~20 دقيقة إذا لم تكن جارية (سير عمل منفصل لا يبطئ الرصد)
          if [ $(( $(date +%s) / 90 % 13 )) -eq 0 ]; then
            t=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tv-pilot.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status!="completed")]|length' || echo 1)
            if [ "$t" = "0" ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/tv-pilot.yml/dispatches" -f ref=main || true; fi
          fi
