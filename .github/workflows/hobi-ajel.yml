# نسخة الهاتف المستقلة من «هوبي عاجل»: جمع كل 10 دقائق + نشر التطبيق على GitHub Pages.
# يعمل فقط بعد رفع المستودع وتفعيل Pages (Settings → Pages → Source: GitHub Actions). لا أسرار مطلوبة.
# مواعيد GitHub المجدولة غير مضمونة (قد تتأخر ساعات في المستودعات الجديدة)، لذلك كل جولة
# تطلق الجولة التالية بنفسها بعد ~10 دقائق من بدايتها. الموعد المجدول احتياط يعيد تشغيل السلسلة إن انقطعت.
name: hobi-ajel
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write, actions: write}
concurrency: {group: hobi-ajel, cancel-in-progress: false}
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: {name: github-pages}
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache/restore@v4
        with: {path: data/marsad.db, key: "marsad-db-${{ github.run_id }}", restore-keys: "marsad-db-"}
      - run: python3 -m marsad.cli sources
      - run: python3 -m marsad.cli collect --limit 60
      - name: process (بدون PDF واللوحة لتسريع الجولة)
        run: python3 -c "from marsad import core; c=core.connect(); core.cluster_items(c); core.generate_alerts(c)"
      - run: python3 -m tools.export_pwa
      - uses: actions/cache/save@v4
        with: {path: data/marsad.db, key: "marsad-db-${{ github.run_id }}"}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: pwa}
      - uses: actions/deploy-pages@v4
      - name: next round (سلسلة — الجولة التالية بعد ~10 دقائق من بداية هذه)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          wait=$(( 570 - ($(date +%s) - START) )); if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/runs?per_page=10" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length')
          if [ "$n" = "0" ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/hobi-ajel.yml/dispatches" -f ref=main && echo "dispatched"; else echo "next round already queued ($n)"; fi
