name: probe-misc
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/probe_official.py config/tv_candidates.txt tv_probe.json
          python3 tools/probe_official.py config/name_candidates.txt name_probe.json
          for n in isharah awwalan nabd_iq; do curl -s -m 15 -A "Mozilla/5.0" "https://t.me/$n" | grep -oE 'tgme_page_title|tgme_page_extra|If you have <strong>Telegram</strong>' | sort -u | sed "s/^/$n: /"; done
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload probe tv_probe.json name_probe.json --clobber
