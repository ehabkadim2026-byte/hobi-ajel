name: probe-list
on:
  workflow_dispatch:
    inputs:
      users: {description: "comma-separated usernames", required: true}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe
        env: {USERS: "${{ github.event.inputs.users }}", GH_TOKEN: "${{ github.token }}"}
        run: |
          cat > p.py <<'PY'
          import os,re,html,urllib.request,json,time
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=25)
                  return r.geturl(),r.read().decode('utf-8','replace')
              except Exception as e: return 'ERR',str(e)
          def og(h,p):
              m=re.search(r'<meta property="og:%s" content="([^"]*)"'%p,h); return html.unescape(m.group(1)) if m else ''
          def clean(t): return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',t))).strip()
          out=[]
          for u in [x.strip() for x in os.environ['USERS'].split(',') if x.strip()]:
              fu,h=get('https://t.me/s/'+u)
              rec={'u':u,'final':fu}
              preview='/s/' in fu and 'tgme_channel_info' in h
              rec['preview']=preview
              rec['title']=og(h,'title'); rec['desc']=og(h,'description')[:150]
              m=re.search(r'<span class="counter_value">([^<]+)</span>\s*<span class="counter_type">(subscribers|members)',h)
              rec['subs']=m.group(1) if m else ''
              if not preview:
                  _,h2=get('https://t.me/'+u)
                  rec['title']=og(h2,'title'); rec['desc']=og(h2,'description')[:150]
                  m=re.search(r'<div class="tgme_page_extra">([^<]+)</div>',h2); rec['extra']=clean(m.group(1)) if m else ''
                  rec['n']=0; rec['last']=''; rec['texts']=[]
              else:
                  msgs=re.split(r'<div class="tgme_widget_message_wrap',h)[1:]
                  texts=[];times=[]
                  for mm in msgs:
                      t=re.search(r'<time datetime="([^"]+)"',mm)
                      if t: times.append(t.group(1))
                      x=re.search(r'class="tgme_widget_message_text[^"]*"[^>]*>(.*?)</div>',mm,re.S)
                      if x: texts.append((t.group(1) if t else '',clean(x.group(1))))
                  rec['n']=len(texts); rec['last']=max(times) if times else ''
                  rec['texts']=[a[:120] for _,a in texts[-2:]]
              out.append(rec); time.sleep(1.2)
          json.dump(out,open('probe_list.json','w'),ensure_ascii=False,indent=1)
          PY
          python3 p.py
          gh release view probe -R ${{ github.repository }} >/dev/null 2>&1 || gh release create probe -R ${{ github.repository }} --title probe --notes "فحوص مؤقتة" --prerelease
          gh release upload probe probe_list.json --clobber -R ${{ github.repository }}
        shell: bash
