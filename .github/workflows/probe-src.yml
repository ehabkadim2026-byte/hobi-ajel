# مؤقت: فحص قنوات تلغرام رسمية مرشحة (يُحذف بعد الفحص)
name: probe-src
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cd .github/probe-src && python3 probe.py
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cd .github/probe-src
          gh release upload probe probe-src.txt probe-src.json --clobber -R ${{ github.repository }}
