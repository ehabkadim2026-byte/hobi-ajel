name: probe-src
on: workflow_dispatch
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for h in PUKMediaArabic Tahriat iq24iraq khozkhabar; do
            p=$(curl -sSL -m 20 "https://t.me/s/$h")
            title=$(echo "$p" | grep -o '<meta property="og:title" content="[^"]*' | head -1 | sed 's/.*content="//')
            last=$(echo "$p" | grep -o 'datetime="[^"]*' | tail -1 | sed 's/datetime="//')
            n=$(echo "$p" | grep -c 'tgme_widget_message_text')
            subs=$(echo "$p" | grep -o '[0-9.]*[KM]* subscribers' | head -1)
            txt=$(echo "$p" | grep -o 'tgme_widget_message_text[^>]*>[^<]\{0,90\}' | tail -2 | sed 's/.*>//' | tr '\n' ' ')
            echo "$h | $title | $subs | posts=$n | last=$last | $txt"
          done | tee probe_new.txt
          gh release upload probe probe_new.txt --clobber -R ${{ github.repository }}
