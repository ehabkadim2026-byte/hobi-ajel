name: probe-src
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY' > /tmp/known.txt
          import json
          for x in json.load(open('config/sources.json'))['sources']:
              if x['platform'] == 'telegram': print(x['url'].rstrip('/').split('/')[-1])
          PY
          python3 tools/_probe_disc.py tools/_probe_q.txt tools/_probe_deep.txt disc.json
          python3 - <<'PY' > /tmp/cands.txt
          import json
          known = {l.strip().lower() for l in open('/tmp/known.txt')} | {l.strip().lower() for l in open('tools/_probe_guess.txt')}
          c = [u for u, n in json.load(open('disc.json'))['counts'] if u not in known]
          print("\n".join(c[:650]))
          PY
          : > /tmp/empty.txt
          python3 tools/_probe_src.py /tmp/empty.txt /tmp/cands.txt /tmp/known.txt src_probe2.json 0
          while read u; do n=$(curl -s -m 20 -A "Mozilla/5.0" "$u" | grep -o '<item>' | wc -l); echo "$n $u"; sleep 1; done < tools/_probe_gn.txt > gn_test.txt
      - if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload probe disc.json src_probe2.json gn_test.txt --clobber -R ${{ github.repository }}
