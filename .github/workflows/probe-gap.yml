name: probe-gap
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe_gap.py .github/probe_gap.json probe_gap.json
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release view probe >/dev/null 2>&1 || gh release create probe --title probe --notes "فحوص مؤقتة" --prerelease
          gh release upload probe probe_gap.json --clobber
